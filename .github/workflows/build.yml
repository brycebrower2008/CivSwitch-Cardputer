name: Build and release Cardputer firmware

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Check compiled binary
        run: test -s .pio/build/cardputer-adv/firmware.bin
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-Cardputer-Adv-firmware
          path: .pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
      - name: Publish development Release (main branch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Cardputer-Adv development build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automatically compiled development firmware.
            On-device Wi-Fi/IP settings, TCP port 9026 diagnostics, and microSD payload-file inspection.
            This build does NOT execute or send the actual Switch exploit or SD payload.
            Not hardware-tested; use at your own risk.
          files: .pio/build/cardputer-adv/firmware.bin
          fail_on_unmatched_files: true
      - name: Publish versioned Release (v* tag)
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .pio/build/cardputer-adv/firmware.bin
          fail_on_unmatched_files: true
