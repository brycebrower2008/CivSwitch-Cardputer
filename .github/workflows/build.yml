name: Build Cardputer firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-Cardputer-Adv-firmware
          path: .pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
