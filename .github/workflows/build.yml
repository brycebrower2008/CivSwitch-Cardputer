name: Build and release Cardputer firmware

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Check compiled binary
        run: test -s .pio/build/cardputer-adv/firmware.bin
      - name: Compile isolated Switch-compatible USB controller test
        run: pio run -e cardputer-adv-usb-test
      - name: Name USB test image separately
        run: |
          test -s .pio/build/cardputer-adv-usb-test/firmware.bin
          cp .pio/build/cardputer-adv-usb-test/firmware.bin firmware-switch-usb-test.bin
      - name: Upload isolated USB controller test
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-USB-controller-only-test
          path: firmware-switch-usb-test.bin
          if-no-files-found: error
      - name: Compile combined Switch USB controller plus keyboard experiment
        run: pio run -e cardputer-adv-usb-combined
      - name: Name combined USB HID image separately
        run: |
          test -s .pio/build/cardputer-adv-usb-combined/firmware.bin
          cp .pio/build/cardputer-adv-usb-combined/firmware.bin firmware-usb-controller-keyboard-test.bin
      - name: Upload experimental combined USB controller and keyboard
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-USB-controller-and-keyboard-test
          path: firmware-usb-controller-keyboard-test.bin
          if-no-files-found: error
      - name: Set up Node.js for upstream payload bundles
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned CivSwitchFS-kaiHEN source
        shell: bash
        run: |
          git clone --depth 1 --branch slop https://github.com/s8n/CivSwitchFS-kaiHEN.git upstream
          git -C upstream fetch --depth 1 origin 4bc6f9157de0db9a577c4507e4a9e84c7f0e32ac
          git -C upstream checkout --detach 4bc6f9157de0db9a577c4507e4a9e84c7f0e32ac
          npm ci --prefix upstream
      - name: Bundle loader-ready SD scripts
        run: node tools/prepare-sd.mjs
      - name: Checkout pinned PicoSwitch USB HID macro generator
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Gezine/CivSwitch.git picoswitch-upstream
          git -C picoswitch-upstream fetch --depth 1 origin f6b0f2bd285e7b32c0a1968181046f18edd79708
          git -C picoswitch-upstream checkout --detach f6b0f2bd285e7b32c0a1968181046f18edd79708
          npm install --prefix picoswitch-upstream/PicoSwitch --no-audit --no-fund
          (cd picoswitch-upstream/PicoSwitch && node compress.js)
      - name: Stage and validate microSD USB HID bootstrap macro
        shell: bash
        run: |
          cp picoswitch-upstream/PicoSwitch/payload.txt sd-package/civswitch/bootstrap.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("sd-package/civswitch/bootstrap.txt")
          rows=[r for r in p.read_text("ascii").splitlines() if r]
          assert rows and len(rows)<=1024, "No HID bootstrap or too many lines"
          assert all(len(r)<=253 and r.isprintable() for r in rows), "Invalid HID line"
          print(f"Validated {len(rows)} HID bootstrap lines")
          PY
      - name: Package SD scripts and corresponding upstream source
        shell: bash
        run: |
          (cd sd-package && zip -q -r ../sd-payloads.zip civswitch README.txt)
          git -C upstream archive --format=zip --output="$PWD/upstream-source.zip" HEAD
          test -s sd-payloads.zip
          test -s upstream-source.zip
          git -C picoswitch-upstream archive --format=zip --output="$PWD/picoswitch-source.zip" HEAD
          test -s picoswitch-source.zip
      - name: Upload SD scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-Cardputer-SD-payloads
          path: sd-payloads.zip
          if-no-files-found: error
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-Cardputer-Adv-firmware
          path: .pio/build/cardputer-adv/firmware.bin
          if-no-files-found: error
      - name: Publish development Release (main branch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Cardputer-Adv development build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Experimental Cardputer standalone JS sender plus SD-ready payload archive.
            firmware.bin is the ESP32-S3 application image; sd-payloads.zip holds bundled JS
            scripts for the Cardputer microSD; upstream-source.zip is the pinned original source.
            Requires CivSwitch Remote JS Loader already running on a compatible Switch.
            File streaming follows the upstream TCP protocol but has NOT been hardware-tested.
            firmware.bin keeps the previous keyboard + generic USB gamepad build.
            firmware-switch-usb-test.bin is a separate controller-only USB test
            using PicoSwitch's 8-byte gamepad descriptor and the compatible
            HORI Pokken VID/PID 0x0F0D:0x0092; it intentionally has no USB
            keyboard or chat exploit macro. Only flash one image at a time.
            USB gamepad recognition on your Switch 2 still needs hardware testing.
            firmware-usb-controller-keyboard-test.bin is an EXPERIMENTAL image
            combining the same Switch-compatible 8-byte controller with a
            keyboard report under Arduino's single HID USB interface.
            A single HID interface is NOT equivalent to PicoSwitch's separate
            controller and keyboard interfaces; actual Switch compatibility is
            unverified. First test A and L+R, then one harmless 'k' in a
            focused text field (H -> U -> K). Never infer typing success from
            a successful compile, and do not run the exploit until verified.
            Generic BLE HID remains experimental; not native Switch2.
            Bootstrap.txt on the Cardputer SD holds the PicoSwitch chat-XSS macro.
            Nintendo Switch 2 USB gamepad recognition and BLE compatibility are NOT verified.
            Bluetooth is standard HID-over-GATT, not the Switch 2 proprietary controller BLE.
            Exploit, persistence and kaiHEN success are not verified by CI. Back up save data.
          files: |
            .pio/build/cardputer-adv/firmware.bin
            firmware-switch-usb-test.bin
            firmware-usb-controller-keyboard-test.bin
            sd-payloads.zip
            upstream-source.zip
            picoswitch-source.zip
          fail_on_unmatched_files: true
      - name: Publish versioned Release (v* tag)
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .pio/build/cardputer-adv/firmware.bin
            firmware-switch-usb-test.bin
            firmware-usb-controller-keyboard-test.bin
            sd-payloads.zip
            upstream-source.zip
            picoswitch-source.zip
          fail_on_unmatched_files: true
